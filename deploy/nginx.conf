map $host $auth_https_origin {
    default https://$host;
    127.0.0.1 https://127.0.0.1:8443;
    localhost https://localhost:8443;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 308 $auth_https_origin$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/auth-demo/server.crt;
    ssl_certificate_key /etc/auth-demo/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/auth-demo/public;
    index index.php;
    client_max_body_size 16k;
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param HTTPS on;
    }
    location ~ /\. { deny all; }
}
